<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="login-card">
        <h2>Crear cuenta</h2>
        <form id="registroForm">
            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre
                </label>
                <input type="text"
                       class="form-control"
                       id="nombre"
                       required>
            </div>

            <!-- Apellido Paterno -->
            <div class="mb-3">
                <label for="apellidoP" class="form-label">
                    Apellido Paterno
                </label>
                <input type="text"
                       class="form-control"
                       id="apellidoP"
                       required>
            </div>

            <!-- Apellido Materno -->
            <div class="mb-3">
                <label for="apellidoM" class="form-label">
                    Apellido Materno
                </label>
                <input type="text"
                       class="form-control"
                       id="apellidoM"
                       required>
            </div>

            <!-- Número de control -->
            <div class="mb-3">
                <label for="control" class="form-label">
                    Número de control
                </label>
                <input type="text"
                       class="form-control"
                       id="control"
                       required>
            </div>

            <!-- Semestre -->
            <div class="mb-3">
                <label for="semestre" class="form-label">
                    Semestre
                </label>
                <select class="form-select" id="semestre" required>
                    <option value="" selected disabled>Selecciona tu semestre</option>
                    <option value="1">1er Semestre</option>
                    <option value="2">2do Semestre</option>
                    <option value="3">3er Semestre</option>
                    <option value="4">4to Semestre</option>
                    <option value="5">5to Semestre</option>
                    <option value="6">6to Semestre</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="semestre" class="form-label">
                    Especialidad
                </label>
                <select class="form-select" id="semestre" required>
                    <option value="" selected disabled>Selecciona tu especialidad</option>
                    <option value="1">Programacion</option>
                    <option value="2">Robotica</option>
                    <option value="3">Ventas</option>
                    <option value="4">Alimentos y Bebidas</option>
                    <option value="5">Gestion de turismo</option>
                </select>
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    Contraseña
                </label>
                <input type="password"
                       class="form-control"
                       id="password"
                       minlength="8"
                       required>
            </div>

            <!-- Confirmar contraseña -->
            <div class="mb-3">
                <label for="confirmar" class="form-label">
                    Confirmar contraseña
                </label>
                <input type="password"
                       class="form-control"
                       id="confirmar"
                       minlength="8"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-success btn-login">
                Registrarme
            </button>
            <div class="text-center mt-3">
                <a href="login.html">
                    ¿Ya tienes cuenta? Inicia sesión
                </a>
            </div>
        </form>
    </div>
    <script src="registro.js"></script>
</body>
</html>
